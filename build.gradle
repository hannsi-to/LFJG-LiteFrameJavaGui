import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id "java"
    id "java-library"
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

group = "me.hannsi.lfjg"
version = "1.0-SNAPSHOT"

def lwjglPlatformMap = [
        "Windows"     : "natives-windows",
        "WindowsX86"  : "natives-windows-x86",
        "WindowsArm64": "natives-windows-arm64",

        "MacOS"       : "natives-macos",
        "MacOSArm64"  : "natives-macos-arm64",

        "Linux"       : "natives-linux",
        "LinuxArm64"  : "natives-linux-arm64",

        "LinuxArm32"  : "natives-linux-arm32",
        "LinuxRiscv64": "natives-linux-riscv64"
]

def ffmpegPlatformMap = [
        "Windows"     : "windows-x86_64",
        "WindowsArm64": "windows-x86_64",

        "MacOS"       : "macosx-x86_64",
        "MacOSArm64"  : "macosx-arm64",

        "Linux"       : "linux-x86_64",
        "LinuxArm64"  : "linux-arm64"
]

ext {
    javaVersion = 21

    nativeTarget = project.findProperty("targetPlatform") ?: "ALL"
    if (nativeTarget != "ALL" && !lwjglPlatformMap.containsKey(nativeTarget)) {
        throw new GradleException("Unknown platform: ${nativeTarget}")
    }
    lwjglPlatforms = nativeTarget == "ALL" ? lwjglPlatformMap : [(nativeTarget): lwjglPlatformMap[nativeTarget]]
    ffmpegPlatforms = nativeTarget == "ALL" ? ffmpegPlatformMap : [(nativeTarget): ffmpegPlatformMap[nativeTarget]]

    lwjgl3Version = "3.3.6"
    lwjgl3awtVersion = "0.1.8"

    steamworks4jVersion = "1.9.0"
    steamworks4jserverVersion = "1.9.0"

    jomlVersion = "1.10.8"
    jomlprimitivesVersion = "1.10.0"

    poly2TriVersion = "0.7.0"
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":core")
    implementation project(":audio")
    implementation project(":frame")
    implementation project(":jcef")
    implementation project(":physic")
    implementation project(":render")
    implementation project(":renderVideo")
    implementation project(":renderText")
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

tasks.named("shadowJar") {
    enabled = false
}

tasks.withType(ShadowJar).configureEach {
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
}

lwjglPlatforms.each { platformName, nativeClassifier ->
    def ffmpegClassifier = ffmpegPlatformMap[platformName]

    tasks.register("shadowJar${platformName}", ShadowJar) {
        group = "distribution"
        description = "Create ${platformName} package"

        archiveClassifier.set(platformName)

        dependencies {
            exclude(dependency {
                it.moduleGroup == "org.lwjgl" &&
                        it.hasProperty("classifier") &&
                        it.classifier &&
                        it.classifier != nativeClassifier
            })
            if (ffmpegClassifier != null) {
                exclude(dependency {
                    it.moduleGroup == "org.bytedeco" &&
                            it.hasProperty("classifier") &&
                            it.classifier &&
                            it.classifier != ffmpegClassifier
                })
            }
        }
    }
}

tasks.register("buildAllPlatforms") {
    group = "distribution"

    dependsOn(lwjglPlatforms.collect { "shadowJar${it.key}" })
}

tasks.named("build") {
    dependsOn("buildAllPlatforms")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add("-Xlint:deprecation")
}