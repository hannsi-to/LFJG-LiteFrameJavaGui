plugins {
    id "java"
    id "java-library"
}

group = "me.hannsi.lfjg.render"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":core")

    api "org.lwjgl:lwjgl-opengl"
    api "org.lwjgl:lwjgl-assimp"
    lwjglPlatforms.each { platformName, nativeClassifier ->
        runtimeOnly "org.lwjgl:lwjgl-opengl::${nativeClassifier}"
        runtimeOnly "org.lwjgl:lwjgl-assimp::${nativeClassifier}"
    }

    implementation "org.orbisgis:poly2tri:$poly2TriVersion"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add("-Xlint:deprecation")
}

test {
    useJUnitPlatform()
}