plugins {
    id "java"
    id "java-library"
}

group = "me.hannsi.lfjg"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.bytedeco:javacv:1.5.13"
    ffmpegPlatforms.each { platformName, nativeClassifier ->
        implementation "org.bytedeco:ffmpeg:7.1-1.5.11:${nativeClassifier}"
    }

    implementation project(":core")

    api "org.lwjgl:lwjgl-openal"
    lwjglPlatforms.each { platformName, nativeClassifier ->
        runtimeOnly "org.lwjgl:lwjgl-openal::${nativeClassifier}"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add("-Xlint:deprecation")
}

test {
    useJUnitPlatform()
}