plugins {
    id "java"
    id "java-library"
}

group = "me.hannsi.lfjg.core"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:2.23.1"
    implementation 'org.apache.logging.log4j:log4j-core:2.25.4'

    annotationProcessor('org.apache.logging.log4j:log4j-core:2.25.4')

    api platform("org.lwjgl:lwjgl-bom:$lwjgl3Version")
    api "org.lwjgl:lwjgl"
    api "org.lwjgl:lwjgl-stb"
    api "org.joml:joml:$jomlVersion"
    api("org.joml:joml-primitives:" + jomlprimitivesVersion)
    api("org.lwjglx:lwjgl3-awt:" + lwjgl3awtVersion)
    lwjglPlatforms.each { platformName, nativeClassifier ->
        runtimeOnly("org.lwjgl:lwjgl::${nativeClassifier}")
        runtimeOnly("org.lwjgl:lwjgl-stb::${nativeClassifier}")
    }

    implementation("org.reflections:reflections:0.10.2")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add("-Xlint:deprecation")
}

test {
    useJUnitPlatform()
}